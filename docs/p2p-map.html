<script>document.documentElement.setAttribute('data-theme','dark');
window.addEventListener('error',function(ev){var b=document.getElementById('errbar');if(!b)return;b.style.display='block';b.textContent+=(b.textContent?' · ':'')+(ev.message||'error')+(ev.lineno?' (line '+ev.lineno+')':'');});</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--panel:#161921;--border:#252836;--text:#e2e8f0;--dim:#6b7594;
  --accent:#3a86ff;
  --base:#ff6b35;--od:#ff9f1c;--v8:#f72585;--ag:#b06de3;--cmd:#3a86ff;
  --ca:#06d6a0;--cc:#48cae4;
}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* TABS */
#tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;overflow-x:auto}
.tab{padding:9px 18px;font-size:11px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab-panel{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab-panel.on{display:flex}

/* HEADER */
header{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--panel);gap:8px;flex-wrap:wrap}
.logo{font-size:13px;font-weight:700;white-space:nowrap}
.logo .p{color:var(--v8)}.logo .c{color:var(--ca)}
.hctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:4px 11px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--dim);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.cross.on{background:var(--v8);border-color:var(--v8)}
.btn.l14.on{background:#7c3aed;border-color:#7c3aed}
.btn.cowork.on{background:var(--ca);border-color:var(--ca);color:#000}
.btn.flow.on{background:#06d6a0;border-color:#06d6a0;color:#000}
.btn.play{border-color:#f72585;color:#f72585}
.btn.play:hover{background:#f72585;color:#fff}
#lang-btn{font-weight:700}
.vsel{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.vsel button{padding:4px 9px;background:transparent;border:none;border-right:1px solid var(--border);color:var(--dim);font-family:inherit;font-size:10.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
.vsel button:last-child{border-right:none}
.vsel button:hover{color:var(--text)}
.vsel button.on{background:var(--accent);color:#fff}

/* FILTERS */
#filters{padding:6px 12px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;background:var(--bg)}
.fb{padding:3px 9px;border-radius:20px;border:1.5px solid transparent;font-family:inherit;font-size:10px;cursor:pointer;transition:all .15s;opacity:.45;white-space:nowrap}
.fb.on{opacity:1}
.fb:hover{opacity:.8}

/* MAIN GRAPH */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#graph{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block}

/* LINKS */
.link{stroke:#2e3248;stroke-opacity:.5;stroke-width:1.2;fill:none}
.link.cross{stroke:var(--v8);stroke-dasharray:5 3;stroke-width:1.8;stroke-opacity:.55}
.link.l14-link{stroke:#a855f7;stroke-width:3;stroke-opacity:.9;stroke-dasharray:none}
.link.k-dep{stroke:#46506e;stroke-opacity:.6;stroke-width:1.3}
.link.k-call{stroke:#525a73;stroke-opacity:.4;stroke-width:1;stroke-dasharray:1 5}
.link.k-handoff{stroke:#ff9f1c;stroke-opacity:.78;stroke-width:1.8;stroke-dasharray:7 4}
.link.k-anchor{stroke:#ffd166;stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:2 4}
.link.hi{stroke-opacity:1!important;stroke-width:2.5!important;filter:drop-shadow(0 0 4px currentColor)}
.link.fade{stroke-opacity:.04!important}

/* NODES */
.node{cursor:pointer}
.node circle{stroke-width:1.5;transition:opacity .15s}
.node text{font-size:9.5px;pointer-events:none;text-anchor:middle;fill:var(--text)}
.node.hi circle{stroke-width:2.5!important;filter:drop-shadow(0 0 8px currentColor)}
.node.fade circle,.node.fade text{opacity:.12}
.node .pulse-dot{animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:.55;r:var(--pr,3)}50%{opacity:1}}
.layer-badge{font-size:9px;font-weight:700;fill:#a855f7;pointer-events:none}
.particles circle{pointer-events:none}

/* TOOLTIP */
#tooltip{position:fixed;pointer-events:none;z-index:300;max-width:240px;background:rgba(13,15,20,.96);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:10.5px;line-height:1.5;color:var(--text);opacity:0;transition:opacity .12s;box-shadow:0 6px 24px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#tooltip .tt-name{font-weight:700;margin-bottom:3px}
#tooltip .tt-desc{color:var(--dim)}

/* INFO PANEL */
#panel{width:280px;flex-shrink:0;border-left:1px solid var(--border);background:var(--panel);padding:14px;overflow-y:auto;font-size:11.5px;line-height:1.6;display:flex;flex-direction:column;gap:10px}
#panel h3{font-size:13px;border-bottom:1px solid var(--border);padding-bottom:7px}
#panel .nid{font-size:10px;color:var(--dim)}
#panel .ndesc{color:var(--dim);font-size:11px}
.cl{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.clist{list-style:none;display:flex;flex-direction:column;gap:3px;margin-top:3px}
.clist li{padding:4px 8px;border-radius:4px;border:1px solid var(--border);cursor:pointer;color:var(--dim);transition:border-color .1s;font-size:11px}
.clist li:hover{border-color:var(--accent);color:var(--text)}
.clist li .ct{font-size:9px;opacity:.55;display:block}
#placeholder{color:var(--dim);font-size:11px;text-align:center;margin-top:24px;line-height:1.9}
#icontent{display:none;flex-direction:column;gap:8px}

/* LEGEND */
#legend{position:absolute;bottom:10px;left:10px;background:rgba(22,25,33,.92);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:9.5px;display:flex;flex-direction:column;gap:4px;pointer-events:none;backdrop-filter:blur(4px);max-height:46%;overflow:auto}
.lr{display:flex;align-items:center;gap:6px;color:var(--dim)}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ll{width:18px;height:2px;flex-shrink:0}
.lda{border-top:2px dashed var(--v8);width:18px;height:0;flex-shrink:0}
.lda.l14{border-color:#a855f7;border-top-width:3px}
#hint{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--dim);pointer-events:none;opacity:.5;white-space:nowrap;text-align:center}

/* MOBILE */
@media(max-width:680px){
  #panel{display:none}
  #panel.mob{display:flex;position:fixed;bottom:0;left:0;right:0;width:100%;height:50vh;border-left:none;border-top:1px solid var(--border);z-index:100;border-radius:14px 14px 0 0}
  #legend{display:none}
  #filters{display:none}
  .logo{font-size:11px}
  .btn{font-size:10px;padding:3px 8px}
  .vsel button{padding:4px 7px;font-size:10px}
  #mdots{display:flex}
  #hint{font-size:9px;max-width:90%}
}
#mdots{display:none;position:fixed;top:50%;right:7px;transform:translateY(-50%);flex-direction:column;gap:4px;z-index:50}
.mdot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;opacity:.45;transition:opacity .15s}
.mdot.on{opacity:1;border-color:rgba(255,255,255,.7)}
#closepanel{display:none;position:absolute;top:7px;right:9px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px}
@media(max-width:680px){#closepanel{display:block}}

/* TAB 2 — MINDMAP */
#mindmap-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.mm-section{border:1px solid var(--border);border-radius:8px;overflow:visible}
.mm-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .12s}
.mm-header:hover{background:rgba(255,255,255,.03)}
.mm-header .mm-icon{font-size:14px;flex-shrink:0}
.mm-header .mm-title{font-size:12px;font-weight:700;flex:1}
.mm-header .mm-count{font-size:10px;color:var(--dim);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:10px}
.mm-header .mm-arrow{font-size:10px;color:var(--dim);transition:transform .2s;flex-shrink:0}
.mm-section.open .mm-arrow{transform:rotate(90deg)}
.mm-body{display:none;border-top:1px solid var(--border);padding:10px 14px;flex-direction:column;gap:6px}
.mm-section.open .mm-body{display:flex;flex-direction:column}
.mm-item{display:flex;flex-direction:column;gap:2px;padding:7px 10px;border-radius:6px;border:1px solid transparent;transition:border-color .12s;width:100%;box-sizing:border-box}
.mm-item:hover{border-color:var(--border)}
.mm-item .mi-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600}
.mm-item .mi-badge{font-size:9px;padding:1px 6px;border-radius:10px;font-weight:700}
.mm-item .mi-desc{font-size:10px;color:var(--dim);line-height:1.5;margin-left:20px}
.mm-item .mi-tags{display:flex;flex-wrap:wrap;gap:3px;margin-left:20px;margin-top:3px}
.mi-tag{font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--dim);border:1px solid rgba(255,255,255,.08)}

/* search */
#mm-search-wrap{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#mm-search{flex:1;min-width:160px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:11px;outline:none}
#mm-search:focus{border-color:var(--accent)}

/* TAB 3 — CHAIN */
#chain-wrap{flex:1;display:flex;overflow:hidden;position:relative}
#chain-left{width:240px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--panel);padding:10px}
#chain-left h4{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding:0 4px}
.scenario-btn{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;line-height:1.4}
.scenario-btn:hover{border-color:var(--accent);color:var(--text)}
.scenario-btn.on{background:rgba(58,134,255,.12);border-color:var(--accent);color:var(--text)}
.scenario-btn .sb-tag{display:block;font-size:9px;color:var(--dim);margin-top:2px}
#chain-right{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#chain-title{font-size:14px;font-weight:700;color:var(--text)}
#chain-desc{font-size:11px;color:var(--dim);line-height:1.6}
#chain-vis{display:flex;flex-direction:column;gap:0;margin-top:4px}
.chain-step{display:flex;align-items:flex-start;gap:0;position:relative}
.cs-line{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0}
.cs-dot{width:12px;height:12px;border-radius:50%;border:2px solid;flex-shrink:0;z-index:1;margin-top:10px;transition:all .3s}
.cs-connector{width:2px;flex:1;min-height:16px;background:var(--border)}
.cs-content{flex:1;padding:8px 0 8px 4px}
.cs-phase{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:3px}
.cs-name{font-size:12px;font-weight:700;margin-bottom:2px}
.cs-detail{font-size:10px;color:var(--dim);line-height:1.5}
.cs-modules{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.cs-mod{font-size:9px;padding:2px 7px;border-radius:4px;border:1px solid;font-weight:600}

/* CHAIN NODE INFO PANEL */
#chain-placeholder{color:var(--dim);font-size:12px;text-align:center;padding:40px 20px;line-height:2}
.cs-node-panel{
  margin-top:8px;padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);background:rgba(255,255,255,.03);
  font-size:11px;line-height:1.6;
  max-height:0;overflow:hidden;
  transition:max-height .3s ease,padding .3s ease;
}
.cs-node-panel.open{max-height:400px;padding:10px 12px}
.cs-np-title{font-weight:700;font-size:12px;margin-bottom:4px}
.cs-np-desc{color:var(--dim);font-size:11px}
.cs-np-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cs-np-tag{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid rgba(255,255,255,.1)}
.cs-np-chain{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.cs-np-chain-title{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.cs-np-chain-item{font-size:10px;padding:4px 8px;border-radius:4px;background:rgba(255,255,255,.04);border-left:2px solid;margin-bottom:3px;line-height:1.4}
.chain-step{cursor:pointer;border-radius:6px;transition:background .15s;padding:2px 4px;margin:1px 0}
.chain-step:hover{background:rgba(255,255,255,.04)}
.chain-step.selected{background:rgba(58,134,255,.08);outline:1px solid rgba(58,134,255,.3)}
.chain-step.active .cs-dot{box-shadow:0 0 8px 2px currentColor;transform:scale(1.25)}

/* chain-placeholder in combined block below */
@media(max-width:680px){
  #chain-wrap{flex-direction:row;position:relative}
  #chain-left{
    position:absolute;left:0;top:0;bottom:0;z-index:50;
    width:220px;max-width:75vw;
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    border-right:1px solid var(--border);
    border-bottom:none;
    overflow-y:auto;
    max-height:none;
    display:flex;flex-direction:column;flex-wrap:nowrap;gap:0;
    box-shadow:6px 0 24px rgba(0,0,0,.7);
    background:var(--panel);
  }
  #chain-left.mob-open{transform:translateX(0)}
  #chain-left h4{width:100%;display:flex;align-items:center;justify-content:space-between}
  .scenario-btn{width:100%;flex:none;margin-bottom:4px}
  #chain-right{flex:1;overflow-y:auto;width:100%;padding:12px}
  #chain-mob-toggle{
    display:flex!important;
    position:fixed;bottom:80px;left:10px;z-index:60;
    background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;
    box-shadow:0 3px 16px rgba(0,0,0,.6);
    align-items:center;gap:6px;
  }
  #chain-mob-overlay{
    display:none;position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.5);
  }
  #chain-mob-overlay.mob-open{display:block}
}
@media(min-width:681px){
  #chain-left h4 button{display:none}
  #chain-mob-toggle{display:none!important}
  #chain-mob-overlay{display:none!important}
}

/* ADDED: what failed is said on the page */
#errbar{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:400;padding:8px 12px;border-radius:8px;background:#5c1020;color:#ffe3e8;border:1px solid #ff4d6d;font-size:11px;line-height:1.5;max-height:30vh;overflow:auto}
#graph-fail{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);max-width:86%;text-align:center;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:12px;line-height:1.7}
/* ADDED: compact scenario list by menu section */
.scenario-btn{padding:5px 8px;margin-bottom:3px;font-size:10.5px}
.scenario-btn .sb-tag{display:inline;margin-left:4px}
.sc-sec{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:10px 4px 4px}

.sel{padding:3px 4px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--dim);font-family:inherit;font-size:10.5px;cursor:pointer}
.sel.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sel option{background:var(--panel);color:var(--text)}
/* ADDED: at rest the links stay thin and calm; a selection still lights them (.hi is !important) */
.link.k-handoff{stroke-opacity:.42;stroke-width:1.1}
.link.k-anchor{stroke-opacity:.3;stroke-width:1}
.link.cross{stroke-width:1.1;stroke-opacity:.38}
.link.k-dep{stroke-width:1.1}

@media(max-width:680px){#tabs{flex-wrap:wrap;overflow-x:visible}.tab{padding:8px 9px}#lang-switch{margin:4px 6px 4px auto!important}}

function ctrlPt(l){const b=bundleMode?.62:0,s=l.source,t=l.target;return[s.x+(0-s.x)*b+(t.x-s.x)*.5*(1-b),s.y+(0-s.y)*b+(t.y-s.y)*.5*(1-b)];}
function linkPath(l){const s=l.source,t=l.target;if(s.x==null||t.x==null)return'';if(!bundleMode)return`M${s.x},${s.y}L${t.x},${t.y}`;const c=ctrlPt(l);return`M${s.x},${s.y}Q${c[0]},${c[1]} ${t.x},${t.y}`;}
function updateLinks(){
  linkSel.attr('d',linkPath);
  badgeSel.attr('x',l=>(l.source.x+l.target.x)/2).attr('y',l=>(l.source.y+l.target.y)/2);
}

  gr.appendChild(box);
}

const tip=document.getElementById('tooltip');
function showTip(e,d){tip.innerHTML=`<div class="tt-name" style="color:${CL[d.cl].c}">${tN(d)}</div><div class="tt-desc">${tD(d)}</div>`;tip.style.opacity='1';moveTip(e);}
function moveTip(e){const pad=14;let x=e.clientX+pad,y=e.clientY+pad;if(x+250>window.innerWidth)x=e.clientX-250;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.opacity='0';}

// ── LAYOUTS ──
let hierDir='horizontal';
function computeTargets(mode){
  const byCl={};CLUSTER_ORDER.forEach(c=>byCl[c]=[]);nodes.forEach(n=>byCl[n.cl].push(n));
  if(mode==='hierarchy'){
    if(hierDir==='vertical'){
      CLUSTER_ORDER.forEach((c,ci)=>{
        const col=byCl[c];
        const y=(ci-(CLUSTER_ORDER.length-1)/2)*155;
        col.forEach((n,i)=>{n.tx=(i-(col.length-1)/2)*85;n.ty=y;});
      });
    } else {
      CLUSTER_ORDER.forEach((c,ci)=>{const col=byCl[c];const x=(ci-(CLUSTER_ORDER.length-1)/2)*210;col.forEach((n,i)=>{n.tx=x;n.ty=(i-(col.length-1)/2)*50;});});
    }
  }else if(mode==='radial'){
    // formula of the original map (R=380 for its 9 groups, a group = circle of radius 34+n*8); R grows with the number of groups so
    // neighbours sit as far apart as in the original, and a group over 18 nodes (the 40 menu items) takes several rings
    const R=Math.max(380,380*CLUSTER_ORDER.length/9);
    CLUSTER_ORDER.forEach((c,ci)=>{const ang=(ci/CLUSTER_ORDER.length)*Math.PI*2-Math.PI/2;const cx=Math.cos(ang)*R,cy=Math.sin(ang)*R;const col=byCl[c];
      if(col.length<=18){const r=34+col.length*8;col.forEach((n,i)=>{const a=(i/col.length)*Math.PI*2;n.tx=cx+Math.cos(a)*r;n.ty=cy+Math.sin(a)*r;});return;}
      const rings=Math.ceil(col.length/18),per=Math.ceil(col.length/rings);
      col.forEach((n,i)=>{const j=Math.floor(i/per),m=Math.min(per,col.length-j*per),r=58+j*52,a=((i-j*per)/m)*Math.PI*2+j*.3;n.tx=cx+Math.cos(a)*r;n.ty=cy+Math.sin(a)*r;});});
  }else if(mode==='rings'){
    CLUSTER_ORDER.forEach((c,ci)=>{const col=byCl[c];const r=70+ci*58;col.forEach((n,i)=>{const a=(i/Math.max(1,col.length))*Math.PI*2+ci*.4;n.tx=Math.cos(a)*r;n.ty=Math.sin(a)*r;});});
  }else if(mode==='depth'){
    const lv=new Map([[ROOT_ID,0]]),q=[ROOT_ID],adj=new Map();
    links.forEach(l=>{const s=idOf(l.source),t=idOf(l.target);if(!adj.has(s))adj.set(s,[]);if(!adj.has(t))adj.set(t,[]);adj.get(s).push(t);adj.get(t).push(s);});
    while(q.length){const id=q.shift();(adj.get(id)||[]).forEach(o=>{if(!lv.has(o)){lv.set(o,lv.get(id)+1);q.push(o);}});}
    let mx=0;lv.forEach(v=>{mx=Math.max(mx,v);});nodes.forEach(n=>{if(!lv.has(n.id))lv.set(n.id,mx+1);});
    const byL={};nodes.forEach(n=>{const k=lv.get(n.id);(byL[k]=byL[k]||[]).push(n);});
    Object.keys(byL).forEach(k=>{const row=byL[k].sort((a,b)=>CLUSTER_ORDER.indexOf(a.cl)-CLUSTER_ORDER.indexOf(b.cl));row.forEach((n,i)=>{const across=(+k)*170;if(hierDir==='vertical'){n.tx=(i-(row.length-1)/2)*80;n.ty=across;}else{n.tx=across;n.ty=(i-(row.length-1)/2)*44;}});});
  }else if(mode==='nests'){
    const root=d3.hierarchy({children:CLUSTER_ORDER.map(c=>({children:byCl[c].map(n=>({n,value:n.r*n.r}))}))}).sum(d=>d.value||0);
    d3.pack().size([1100,1100]).padding(8)(root);
    root.leaves().forEach(l=>{if(l.data.n){l.data.n.tx=l.x-550;l.data.n.ty=l.y-550;}});
  }else if(mode==='bundles'){
    const ordered=[];CLUSTER_ORDER.forEach(c=>byCl[c].forEach(n=>ordered.push(n)));const R=470;
    ordered.forEach((n,i)=>{const a=(i/ordered.length)*Math.PI*2-Math.PI/2;n.tx=Math.cos(a)*R;n.ty=Math.sin(a)*R;});
  }else if(mode==='circle'){
    const ordered=[];CLUSTER_ORDER.forEach(c=>byCl[c].forEach(n=>ordered.push(n)));const R=440;
    ordered.forEach((n,i)=>{const a=(i/ordered.length)*Math.PI*2-Math.PI/2;n.tx=Math.cos(a)*R;n.ty=Math.sin(a)*R;});
  }
}
const ISL={};
function islandCenters(){const n=CLUSTER_ORDER.length,cols=Math.ceil(Math.sqrt(n));CLUSTER_ORDER.forEach((c,i)=>{ISL[c]=[((i%cols)-(cols-1)/2)*340,(Math.floor(i/cols)-(Math.ceil(n/cols)-1)/2)*270];});}
function compute3d(){const byCl={};CLUSTER_ORDER.forEach(c=>byCl[c]=[]);nodes.forEach(n=>byCl[n.cl].push(n));const k=CLUSTER_ORDER.length;CLUSTER_ORDER.forEach((c,ci)=>{const col=byCl[c];col.forEach((n,i)=>{n.th=(i/col.length)*2*Math.PI+ci*.35;n.R3=380;n.h3=(ci-(k-1)/2)*80;});});}
function frame3D(){
  if(!threeD)return;
  if(autoRot)rot+=.0045;
  nodes.forEach(n=>{const a=n.th+rot,c=Math.cos(a),s=Math.sin(a),dp=(c+1)/2,ps=.55+dp*.75;n.x=n.R3*s*ps;n.y=n.h3*ps*.82-c*26*.45;n.dp=dp;});
  updateLinks();nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`).attr('opacity',d=>.25+d.dp*.75);
  linkSel.attr('opacity',l=>.1+((l.source.dp+l.target.dp)/2)*.5);
  requestAnimationFrame(frame3D);
}
function applyLayout(mode){
  if(!sim)return;
  currentLayout=mode;
  document.querySelectorAll('#layout-switch button').forEach(b=>b.classList.toggle('on',b.dataset.lay===mode));
  const hierBtn=document.getElementById('b-hier-dir');
  if(hierBtn)hierBtn.style.display=(mode==='hierarchy'||mode==='depth')?'':'none';
  document.getElementById('b-rot').style.display=mode==='3d'?'':'none';
  bundleMode=mode==='bundles';
  const was3d=threeD;threeD=mode==='3d';
  if(was3d&&!threeD){nodeSel.attr('opacity',null);linkSel.attr('opacity',null);}
  nodes.forEach(n=>{n.fx=null;n.fy=null;});
  sim.force('x',null).force('y',null);
  if(mode==='force'){
    sim.force('charge',d3.forceManyBody().strength(-230));
    sim.force('cluster',clusterForce);
    sim.force('link').distance(l=>l.t==='x'?210:75).strength(l=>l.ref?.03:l.t==='x'?.2:.55);
  }else if(mode==='islands'){
    islandCenters();sim.force('cluster',null);
    sim.force('charge',d3.forceManyBody().strength(-120));
    sim.force('x',d3.forceX(d=>ISL[d.cl][0]).strength(.14));
    sim.force('y',d3.forceY(d=>ISL[d.cl][1]).strength(.14));
    sim.force('link').distance(60).strength(l=>{const a=nodeById.get(idOf(l.source)),b=nodeById.get(idOf(l.target));return a&&b&&a.cl===b.cl?.3:.01;});
  }else if(mode==='3d'){
    sim.stop();compute3d();rot=0;autoRot=true;frame3D();setTimeout(fitView,300);return;
  }else{
    computeTargets(mode);
    sim.force('cluster',null);
    sim.force('charge',d3.forceManyBody().strength(-30));
    sim.force('x',d3.forceX(d=>d.tx).strength(.6));
    sim.force('y',d3.forceY(d=>d.ty).strength(.6));
    sim.force('link').strength(l=>l.ref?0:.02);   // mentions do not pull a fixed layout
  }
  sim.alpha(.9).restart();
  setTimeout(fitView,700);
}
function fitView(){
  if(!svg)return;
  const vis=nodes.filter(n=>activeFilters.has(n.cl)&&!(coworkMode&&!COWORK_NODES.has(n.id)));
  if(!vis.length)return;
  // fixed layouts: where the nodes are going, not where they are mid-move; 3D: the whole turning cylinder
  const fixed=!threeD&&currentLayout!=='force'&&currentLayout!=='islands';
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  vis.forEach(n=>{let x=fixed&&n.tx!=null?n.tx:n.x,y=fixed&&n.ty!=null?n.ty:n.y,rx=n.r+6,ry=n.r+6;
    if(threeD){x=0;rx=n.R3*1.32+n.r;y=n.h3*.9;ry=Math.abs(n.h3)*.45+34;}
    const lw=labelsOn||n.deg>=HUB_DEG?Math.min(tN(n).length*2.9,80):0;
    minX=Math.min(minX,x-Math.max(rx,lw));maxX=Math.max(maxX,x+Math.max(rx,lw));minY=Math.min(minY,y-ry);maxY=Math.max(maxY,y+ry+14);});
  const box=svg.node().getBoundingClientRect(),w=box.width,h=box.height,pad=w<500?10:24;
  if(!w||!h)return;   // the map tab is hidden: d3-zoom would interpolate over a zero-size extent (NaN)
  const scale=Math.max(.06,Math.min((w-2*pad)/(maxX-minX),(h-2*pad)/(maxY-minY),1.6));
  const tx=w/2-scale*(minX+maxX)/2,ty=h/2-scale*(minY+maxY)/2;
  svg.interrupt();
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));
}

// ── PARTICLES ──
let particles=[];
function linkVisible(l){
  const sid=idOf(l.source),tid=idOf(l.target),sn=nodeById.get(sid),tn=nodeById.get(tid);
  if(!sn||!tn)return false;
  if(l.ref)return !!selNode&&(sid===selNode.id||tid===selNode.id)&&activeFilters.has(sn.cl)&&activeFilters.has(tn.cl);
  if(!logicOn&&l.k)return false;
  if(!activeFilters.has(sn.cl)||!activeFilters.has(tn.cl))return false;
  if(coworkMode&&!COWORK_NODES.has(sid)&&!COWORK_NODES.has(tid))return false;
  if(l14Mode)return !!l._isL14;
  if(crossOnly)return l.t==='x';
  return true;
}
function rebuildParticles(){
  if(!partLayer)return;
  particles=[];
  if(flowOn){
    // as in the original map: particles only on plain and handoff links; one per link (the original had two on handoff, 7 such links)
    links.filter(l=>linkVisible(l)&&!l.ref&&(!l.k||l.k==='handoff')).forEach(l=>{particles.push({l,t:Math.random(),sp:.0016+Math.random()*.004});});
  }
  const sel=partLayer.selectAll('circle').data(particles);
  sel.exit().remove();
  sel.enter().append('circle').attr('r',p=>p.l.t==='x'?2.4:1.8).merge(sel)
    .attr('fill',p=>{const sn=nodeById.get(idOf(p.l.source));return p.l.t==='x'?PINK():(sn?CL[sn.cl].c:'#3a86ff');})
    .attr('opacity',.9);
}
function animParticles(){
  if(flowOn&&partLayer){
    partLayer.selectAll('circle').each(function(p){
      p.t+=p.sp;if(p.t>1)p.t-=1;
      const s=p.l.source,t=p.l.target;
      if(typeof s==='object'&&typeof t==='object'){
        let x,y;if(bundleMode){const c=ctrlPt(p.l),u=1-p.t;x=u*u*s.x+2*u*p.t*c[0]+p.t*p.t*t.x;y=u*u*s.y+2*u*p.t*c[1]+p.t*p.t*t.y;}else{x=s.x+(t.x-s.x)*p.t;y=s.y+(t.y-s.y)*p.t;}
        d3.select(this).attr('cx',x).attr('cy',y).style('display',null);
      }else d3.select(this).style('display','none');
    });
  }
  requestAnimationFrame(animParticles);
}
if(partLayer){rebuildParticles();animParticles();}

// ── PLAY: a task through /p2p and the QUORUM rounds ──
let playing=false;
function ripple(n,col){
  const c=g.insert('circle',':first-child').attr('cx',n.x).attr('cy',n.y).attr('r',n.r).attr('fill','none').attr('stroke',col).attr('stroke-width',2.5).attr('opacity',.95);
  c.transition().duration(950).ease(d3.easeCubicOut).attr('r',n.r+50).attr('stroke-width',.4).attr('opacity',0).remove();
}
function playFlow(){
  if(playing||!nodeSel)return;playing=true;
  switchTab('graph');resetSel();
  document.getElementById('b-play').classList.add('on');
  let i=0;
  const step=()=>{
    if(i>=FLOW_PATH.length){
      setTimeout(()=>{resetSel();document.getElementById('b-play').classList.remove('on');playing=false;},900);
      return;
    }
    const id=FLOW_PATH[i],n=nodeById.get(id),col=CL[n.cl].c;
    ripple(n,col);
    nodeSel.filter(d=>d.id===id).classed('hi',true);
    if(i>0){const a=FLOW_PATH[i-1],b=id;linkSel.filter(l=>{const s=idOf(l.source),t=idOf(l.target);return(s===a&&t===b)||(s===b&&t===a);}).classed('hi',true);}
    i++;setTimeout(step,500);
  };
  step();
}

function nodeConns(d){return links.filter(l=>idOf(l.source)===d.id||idOf(l.target)===d.id);}
function selectNode(d){
  if(!nodeSel)return;
  selNode=d;const connIds=new Set([d.id]);
  nodeConns(d).forEach(l=>{connIds.add(idOf(l.source));connIds.add(idOf(l.target));});
  nodeSel.classed('hi',n=>n.id===d.id).classed('fade',n=>!connIds.has(n.id));
  linkSel.classed('hi',l=>idOf(l.source)===d.id||idOf(l.target)===d.id).classed('fade',l=>idOf(l.source)!==d.id&&idOf(l.target)!==d.id);
  linkSel.style('display',l=>linkVisible(l)?null:'none');
  showInfo(d);document.getElementById('panel').classList.add('mob');
}
function showInfo(d){
  document.getElementById('placeholder').style.display='none';
  const ic=document.getElementById('icontent');ic.style.display='flex';ic.style.flexDirection='column';ic.style.gap='8px';
  const ic_cl=document.getElementById('i-cluster');ic_cl.textContent=`[${d.cl}] ${CL[d.cl][LANG==='ru'?'ru':'en']}`;ic_cl.style.color=CL[d.cl].c;
  const nm=document.getElementById('i-name');nm.textContent=tN(d);nm.style.color=CL[d.cl].c;
  document.getElementById('i-desc').textContent=tD(d);
  const ul=document.getElementById('i-conns');ul.innerHTML='';
  nodeConns(d).forEach(l=>{
    const sid=idOf(l.source),tid=idOf(l.target),otherId=sid===d.id?tid:sid,dir=sid===d.id?'→':'←',other=nodeById.get(otherId);
    if(!other)return;
    const li=document.createElement('li'),badge=l._isL14?` <span style="color:#a855f7;font-size:9px">[${l.layer}]</span>`:'',xbadge=l.t==='x'?' ⚡':'';
    const KIND={dep:['depends','#46506e'],call:['ref','#525a73'],handoff:['handoff','#ff9f1c'],anchor:['anchor','#ffd166'],mirror:['mirror','#f72585']};
    const kb=l.k&&KIND[l.k]?` <span style="font-size:8px;padding:0 4px;border-radius:6px;background:${KIND[l.k][1]}33;color:${KIND[l.k][1]==='#46506e'||KIND[l.k][1]==='#525a73'?'var(--dim)':KIND[l.k][1]}">${KIND[l.k][0]}</span>`:'';
    li.innerHTML=`<span style="color:${CL[other.cl].c}">${dir} ${tN(other)}${badge}${kb}</span><span class="ct">${tL(l)}${xbadge}</span>`;
    li.onclick=()=>selectNode(other);ul.appendChild(li);
  });
}
function resetSel(){selNode=null;if(!nodeSel)return;nodeSel.classed('hi',false).classed('fade',false);linkSel.classed('hi',false).classed('fade',false);linkSel.style('display',l=>linkVisible(l)?null:'none');document.getElementById('placeholder').style.display='block';document.getElementById('icontent').style.display='none';document.getElementById('panel').classList.remove('mob');}

function applyFilters(){
  if(!nodeSel)return;
  nodeSel.style('display',d=>{if(!activeFilters.has(d.cl))return'none';if(coworkMode&&!COWORK_NODES.has(d.id))return'none';return null;});
  linkSel.style('display',l=>linkVisible(l)?null:'none');
  badgeSel.style('display',l14Mode?l=>l._isL14?null:'none':()=>'none');
  rebuildParticles();
  setTimeout(fitView,80);
}

// ══════════════════════════════════════════════════════════════
// TAB 2: MINDMAP
// ══════════════════════════════════════════════════════════════
const tx=v=>v&&typeof v==='object'&&'ru' in v?v[LANG]:v;
const L=(ru,en)=>({ru,en});
// ── ADAPTER: Mindmap = the groups of the graph, each file a card ──
const MM_ICON={entry:'⤵',base:'📦',target:'🎯',live:'📊',ondemand:'⚡',technique:'✦',meta:'📇',command:'⌨',wrapper:'⧸',rag:'🔎',agent:'👁',menu:'☰',docs:'📄'};
const LOAD_BADGE={'startup':L('ЗАПУСК','START'),'first task':L('1-Я ЗАДАЧА','FIRST TASK'),'target':L('ЦЕЛЬ','TARGET'),'live specs':L('LIVE','LIVE'),
  'on demand':L('ПО ЗАПРОСУ','ON DEMAND'),'menu item':L('МЕНЮ','MENU')};
const SECTION_NAME={};GRAPH.chain_sections.forEach(s=>{SECTION_NAME[s.id]=L(s.ru,s.en);});
const MM_SECTIONS=GROUP_ORDER.map(g=>({id:g,get color(){return CL[g].c;},icon:MM_ICON[g]||'•',title:L(CL[g].ru,CL[g].en),
  items:GRAPH.nodes.filter(n=>n.group===g).sort((a,b)=>g==='menu'?a.menu-b.menu:(DEG[b.id]||0)-(DEG[a.id]||0)).map(n=>{
    const tags=[];if(n.command)tags.push(n.command);if(Array.isArray(n.menu))tags.push(n.menu.map(x=>'['+x+']').join(' '));
    if(n.section&&SECTION_NAME[n.section])tags.push(SECTION_NAME[n.section]);
    tags.push(L((DEG[n.id]||0)+' связей',(DEG[n.id]||0)+' links'));if(n.kind!=='menu')tags.push(n.file+(n.line?':'+n.line:''));
    const trg=(n.triggers||[]).slice(0,6),trgEn=trg.filter(x=>!/[\u0400-\u04FF]/.test(x));   // trigger words of the plugin: Russian ones are shown in RU only
    if(trg.length)tags.push(L(trg.join(' · '),trgEn.join(' · ')||'—'));
    return{name:L(n.label_ru||n.label,n.label),badge:LOAD_BADGE[n.load]||'·',get badgeColor(){return CL[g].c;},desc:L(n.summary_ru||'',n.summary_en||''),tags};})}));
MM_SECTIONS.push({id:'findings',get color(){return PINK();},icon:'⚑',title:L('Находки проверок','Findings of the checks'),
  items:GRAPH.findings.map(f=>({name:'',badge:L('ПРОВЕРКА','CHECK'),get badgeColor(){return PINK();},desc:L(f.ru,f.en),tags:[]}))});

function makeMmItem(it){
  const d=document.createElement('div');
  d.className='mm-item';
  const both=v=>v&&typeof v==='object'?v.ru+' '+v.en:v;
  d.dataset.search=(both(it.name)+' '+both(it.desc)+' '+it.tags.map(both).join(' ')).toLowerCase();
  const h=document.createElement('div');h.className='mi-head';
  const b=document.createElement('span');b.className='mi-badge';
  b.style.cssText='background:'+it.badgeColor+'22;color:'+it.badgeColor+';border:1px solid '+it.badgeColor+'44';
  b.textContent=tx(it.badge);
  const n=document.createElement('span');n.style.color='var(--text)';n.textContent=tx(it.name);
  h.appendChild(b);h.appendChild(n);
  const desc=document.createElement('div');desc.className='mi-desc';desc.textContent=tx(it.desc);
  const tags=document.createElement('div');tags.className='mi-tags';
  it.tags.forEach(t=>{const s=document.createElement('span');s.className='mi-tag';s.textContent=tx(t);tags.appendChild(s);});
  d.appendChild(h);d.appendChild(desc);d.appendChild(tags);
  return d;
}
function renderMindmap(){
  const wrap=document.getElementById('mindmap-wrap');
  const openIds=new Set([...wrap.querySelectorAll('.mm-section.open')].map(s=>s.dataset.secId));
  wrap.innerHTML='';
  MM_SECTIONS.forEach((sec,si)=>{
    const sec_div=document.createElement('div');
    sec_div.className='mm-section'+((openIds.size?openIds.has(sec.id):si===0)?' open':'');
    sec_div.dataset.secId=sec.id;
    // Header
    const hdr=document.createElement('div');
    hdr.className='mm-header';
    hdr.style.cssText='border-left:3px solid '+sec.color;
    hdr.onclick=function(){toggleSection(this);};
    const icon=document.createElement('span');icon.className='mm-icon';icon.textContent=sec.icon;
    const ttl=document.createElement('span');ttl.className='mm-title';ttl.style.color=sec.color;ttl.textContent=tx(sec.title);
    const cnt=document.createElement('span');cnt.className='mm-count';cnt.textContent=sec.items.length;
    const arr=document.createElement('span');arr.className='mm-arrow';arr.textContent='▶';
    hdr.appendChild(icon);hdr.appendChild(ttl);hdr.appendChild(cnt);hdr.appendChild(arr);
    // Body
    const body=document.createElement('div');body.className='mm-body';
    sec.items.forEach(it=>body.appendChild(makeMmItem(it)));
    sec_div.appendChild(hdr);sec_div.appendChild(body);
    wrap.appendChild(sec_div);
  });
}
window.toggleSection=function(header){
  const sec=header.parentElement;
  sec.classList.toggle('open');
};
window.mmAll=function(open){document.querySelectorAll('.mm-section').forEach(s=>s.classList.toggle('open',open));};
window.mmSearch=function(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.mm-section').forEach(sec=>{
    let anyVisible=false;
    sec.querySelectorAll('.mm-item').forEach(item=>{
      const match=!q||item.dataset.search.includes(q);
      item.style.display=match?'':'none';
      if(match)anyVisible=true;
    });
    sec.style.display=anyVisible?'':'none';
    if(q&&anyVisible)sec.classList.add('open');
  });
};
try{renderMindmap();}catch(e){pageFail('mindmap',e);}

// ══════════════════════════════════════════════════════════════
// TAB 3: CHAIN LOADER
// ══════════════════════════════════════════════════════════════
// ── ADAPTER: Chain Loader = the scenarios of the graph (one per menu item and command, plus the long flows), by section ──
const nodeColor=id=>{const n=GN.get(id);return n&&CL[n.group]?CL[n.group].c:'#3a86ff';};
const nodeName=(id,ru)=>{const n=GN.get(id);return n?(ru&&n.label_ru?n.label_ru:n.label):id;};
const SCENARIOS=GRAPH.chains.map(c=>{const last=c.steps[c.steps.length-1];const main=last?(last.nodes.find(id=>(GN.get(id)||{}).kind!=='menu')||last.nodes[0]):null;
  return{id:c.id,section:c.section,label:L(c.title_ru,c.title_en),tag:c.title_en.includes(c.tag)?'':c.tag,get color(){return main?nodeColor(main):'#3a86ff';},
    desc:L(c.desc_ru,c.desc_en),nodes:c.steps.map(s=>s.nodes),
    steps:c.steps.map((s,i)=>{const m=s.nodes.find(id=>(GN.get(id)||{}).kind!=='menu')||s.nodes[0];
      return{phase:(i+1)+' · '+s.evidence,name:L(s.nodes.map(id=>nodeName(id,true)).join(' · '),s.nodes.map(id=>nodeName(id,false)).join(' · ')),
        detail:L(s.ru,s.en),get color(){return nodeColor(m);},mods:s.nodes.map(id=>L(nodeName(id,true),nodeName(id,false)))};})};});

function renderScenarios(){
  const list=document.getElementById('scenario-list');
  list.innerHTML='';
  let sec=null;
  SCENARIOS.forEach(s=>{
    if(s.section!==sec){sec=s.section;const h=document.createElement('div');h.className='sc-sec';h.textContent=tx(SECTION_NAME[sec]||sec);list.appendChild(h);}
    const btn=document.createElement('button');
    btn.className='scenario-btn';
    btn.dataset.id=s.id;
    btn.innerHTML=`<span style="color:${s.color};font-weight:700">${tx(s.label)}</span><span class="sb-tag">${tx(s.tag)}</span>`;
    btn.onclick=()=>loadScenario(s.id);
    if(currentScenario&&currentScenario.id===s.id)btn.classList.add('on');
    list.appendChild(btn);
  });
}

let currentScenario=null,animating=false;
// NODE INFO for RAG/chain panels
// ── ADAPTER: the panel under a step = what its files are and where they lead next (working links of the graph) ──
const NODE_INFO={};
SCENARIOS.forEach(s=>s.steps.forEach((st,i)=>{const ids=s.nodes[i];
  NODE_INFO[st.name.ru]={summary:L(ids.map(id=>(GN.get(id)||{}).summary_ru||'').join(' '),ids.map(id=>(GN.get(id)||{}).summary_en||'').join(' ')),
    chain:ids.flatMap(id=>GRAPH.edges.filter(e=>e.from===id&&e.kind!=='reference').slice(0,3).map(e=>({l:'→ '+nodeName(e.to,false),n:L(KIND_RU[e.kind]+' · '+e.evidence,KIND_EN[e.kind]+' · '+e.evidence)})))};}));
function getNodeInfo(name){
  if(NODE_INFO[name])return NODE_INFO[name];
  const l=name.toLowerCase();
  for(const k of Object.keys(NODE_INFO))if(l.includes(k.toLowerCase())||k.toLowerCase().includes(l))return NODE_INFO[k];
  return null;
}

let selectedStepEl=null;
function selectStep(el,step){
  if(selectedStepEl&&selectedStepEl!==el){
    selectedStepEl.classList.remove('selected');
    const old=selectedStepEl.querySelector('.cs-node-panel');
    if(old){old.classList.remove('open');setTimeout(()=>{try{old.remove()}catch(e){}},300);}
  }
  if(selectedStepEl===el){
    el.classList.remove('selected');
    const p=el.querySelector('.cs-node-panel');
    if(p){p.classList.remove('open');setTimeout(()=>{try{p.remove()}catch(e){}},300);}
    selectedStepEl=null;return;
  }
  selectedStepEl=el;
  el.classList.add('selected');
  const info=getNodeInfo(typeof step.name==='object'?step.name.ru:step.name);
  const panel=document.createElement('div');
  panel.className='cs-node-panel';
  const chainHtml=info&&info.chain?'<div class="cs-np-chain"><div class="cs-np-chain-title">'+(LANG==='ru'?'🔗 Внутренние цепочки промпта':'🔗 Inner prompt chains')+'</div>'+info.chain.map(c=>'<div class="cs-np-chain-item" style="border-color:'+step.color+'">'+tx(c.l)+' <span style="color:var(--dim);font-size:9px">— '+tx(c.n)+'</span></div>').join('')+'</div>':'';
  panel.innerHTML='<div class="cs-np-title" style="color:'+step.color+'">📍 '+tx(step.name)+'</div><div class="cs-np-desc">'+tx(info?info.summary:step.detail)+'</div><div class="cs-np-tags">'+step.mods.map(m=>'<span class="cs-np-tag" style="border-color:'+step.color+'44;color:'+step.color+'">'+tx(m)+'</span>').join('')+'</div>'+chainHtml;
  el.querySelector('.cs-content').appendChild(panel);
  setTimeout(()=>panel.classList.add('open'),20);
}

function loadScenario(id){
  const s=SCENARIOS.find(x=>x.id===id);
  if(!s||animating)return;
  currentScenario=s;selectedStepEl=null;
  document.querySelectorAll('.scenario-btn').forEach(b=>{b.classList.toggle('on',b.dataset.id===id);});
  chainMobClose();
  const vis=document.getElementById('chain-vis');
  const ph=document.getElementById('chain-placeholder');
  const title=document.getElementById('chain-title');
  const desc=document.getElementById('chain-desc');
  ph.style.display='none';title.style.display='block';desc.style.display='block';
  title.innerHTML='<span style="color:'+s.color+'">⛓ '+tx(s.label)+'</span> <span style="font-size:11px;color:var(--dim);font-weight:400">'+tx(s.tag)+'</span>';
  desc.textContent=tx(s.desc);
  vis.innerHTML='';animating=true;
  s.steps.forEach((step,i)=>{
    const el=document.createElement('div');
    el.className='chain-step';
    el.style.cssText='opacity:0;transform:translateX(-10px);transition:all 0.3s ease';
    el.innerHTML='<div class="cs-line"><div class="cs-dot" style="border-color:'+step.color+';background:'+step.color+'22"></div>'+(i<s.steps.length-1?'<div class="cs-connector"></div>':'')+'</div><div class="cs-content"><div class="cs-phase" style="color:'+step.color+'">'+step.phase+'</div><div class="cs-name" style="color:'+step.color+'">'+tx(step.name)+'</div><div class="cs-detail">'+tx(step.detail)+'</div><div class="cs-modules">'+step.mods.map(m=>'<span class="cs-mod" style="border-color:'+step.color+'44;color:'+step.color+';background:'+step.color+'11">'+tx(m)+'</span>').join('')+'</div></div>';
    el.onclick=()=>selectStep(el,step);
    vis.appendChild(el);
    setTimeout(()=>{
      el.style.opacity='1';el.style.transform='translateX(0)';
      el.classList.add('active');setTimeout(()=>el.classList.remove('active'),400);
      if(i===s.steps.length-1)animating=false;
    },i*140+60);
  });
}

function chainMobToggle(){
  document.getElementById('chain-left').classList.toggle('mob-open');
  document.getElementById('chain-mob-overlay').classList.toggle('mob-open');
}
function chainMobClose(){
  const l=document.getElementById('chain-left');
  const o=document.getElementById('chain-mob-overlay');
  if(l)l.classList.remove('mob-open');
  if(o)o.classList.remove('mob-open');
}
document.getElementById('b-hier-dir').addEventListener('click',function(){
  hierDir=hierDir==='horizontal'?'vertical':'horizontal';
  document.getElementById('hier-dir-label').textContent=hierDir==='vertical'?(LANG==='ru'?'Гор.':'Horiz.'):(LANG==='ru'?'Верт.':'Vert.');
  if(currentLayout==='hierarchy'||currentLayout==='depth')applyLayout(currentLayout);
});

try{renderScenarios();}catch(e){pageFail('chain loader',e);}

// ── ADDED: labels on/off, ↯ walk from the core ──
var labelsOn=true;   // the original map shows every label, on the phone too
function applyLabels(){document.getElementById('b-labels').classList.toggle('on',labelsOn);if(!nodeLabel)return;nodeLabel.style('display',d=>labelsOn||d.deg>=HUB_DEG?null:'none');document.getElementById('b-labels').classList.toggle('on',labelsOn);}
document.getElementById('b-labels').addEventListener('click',()=>{labelsOn=!labelsOn;applyLabels();});
applyLabels();
function coreWalk(){const path=[ROOT_ID],seen=new Set(path);
  for(let s=0;s<7;s++){const cur=path[path.length-1];
    let nb=links.filter(l=>idOf(l.source)===cur&&!l.ref&&linkVisible(l)).map(l=>nodeById.get(idOf(l.target))).filter(n=>n&&!seen.has(n.id));
    if(!nb.length)nb=links.filter(l=>(idOf(l.source)===cur||idOf(l.target)===cur)&&linkVisible(l)).map(l=>nodeById.get(idOf(l.source)===cur?idOf(l.target):idOf(l.source))).filter(n=>n&&!seen.has(n.id));
    if(!nb.length)break;nb.sort((a,b)=>b.deg-a.deg||(a.id<b.id?-1:1));path.push(nb[0].id);seen.add(nb[0].id);}
  return path;}
let walking=false;
document.getElementById('b-core').addEventListener('click',()=>{
  if(walking||playing||!nodeSel)return;walking=true;resetSel();const path=coreWalk(),btn=document.getElementById('b-core');btn.classList.add('on');
  const on=new Set();nodeSel.classed('fade',d=>!path.includes(d.id));linkSel.classed('fade',true);
  path.forEach((id,i)=>setTimeout(()=>{const n=nodeById.get(id);on.add(id);ripple(n,'#6ea8fe');nodeSel.filter(d=>d.id===id).classed('hi',true).classed('fade',false);
    if(i>0){const a=path[i-1];linkSel.filter(l=>{const s=idOf(l.source),t=idOf(l.target);return(s===a&&t===id)||(s===id&&t===a);}).classed('fade',false).classed('hi',true);}
    if(i===path.length-1)setTimeout(()=>{btn.classList.remove('on');walking=false;},900);},i*800));});
// ── ADDED: one-line toolbar — the four layouts of the owner as buttons, the rest under «More ▾» ──
(function(){const sw=document.getElementById('layout-switch'),extra=['islands','rings','depth','nests','bundles','3d'];
  const sel=document.createElement('select');sel.id='lay-more';sel.className='sel';
  sel.innerHTML='<option value="" data-ru="Ещё ▾" data-en="More ▾">Ещё ▾</option>'+extra.map(l=>{const b=sw.querySelector('[data-lay="'+l+'"]');
    return '<option value="'+l+'" data-ru="'+b.dataset.ru+'" data-en="'+b.dataset.en+'">'+b.dataset.ru+'</option>';}).join('');
  extra.forEach(l=>{sw.querySelector('[data-lay="'+l+'"]').style.display='none';});sw.after(sel);
  sel.addEventListener('change',()=>{if(sel.value)sw.querySelector('[data-lay="'+sel.value+'"]').click();});
  sw.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const x=extra.includes(b.dataset.lay);sel.value=x?b.dataset.lay:'';sel.classList.toggle('on',x);}));})();
// ── ADDED: the group dots on the phone are named in the current language too ──
const setLangEngine=setLang;
setLang=function(l){setLangEngine(l);const ids=Object.keys(CL);document.querySelectorAll('.mdot').forEach((d,i)=>{d.title=LANG==='ru'?CL[ids[i]].ru:CL[ids[i]].en;});};

setLang('en');
window.addEventListener('resize',()=>{if(document.getElementById('tp-graph').classList.contains('on'))fitView();});
</script>
