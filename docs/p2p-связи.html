<!doctype html>
<meta charset="utf-8">
<title>P2P — связи файлов по поколениям</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --line:#242833; --ink:#e6e9ef; --dim:#8b93a7;
  --core:#ff6b6b; --db:#ffd166; --mod:#4cc9f0; --data:#8ac926; --doc:#b48ef0; --meta:#f7a072;
  --edge:#2b3140; --hot:#ffffff;
}
*{box-sizing:border-box}
/* .wrap задан display:grid — без !important атрибут hidden им перебивается */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:18px 22px 10px}
h1{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:.2px}
h1 span{color:var(--mod)}
.sub{color:var(--dim);font-size:13px}
.rail{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px 6px}
.rail button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
.rail button:hover{color:var(--ink);border-color:#39405a}
.rail button.on{background:var(--mod);color:#08111a;border-color:var(--mod)}
.bodies{display:flex;gap:6px;flex-wrap:wrap;padding:2px 22px 12px}
.bodies button{background:transparent;color:var(--dim);border:1px dashed var(--line);
  border-radius:7px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.bodies button.on{color:var(--ink);border-style:solid;border-color:var(--mod)}
.bodies button .side{color:var(--dim);font-size:11px;margin-left:5px}
.wrap{display:grid;grid-template-columns:1fr 330px;gap:14px;padding:0 22px 22px;align-items:start}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:700px;cursor:grab}
svg:active{cursor:grabbing}
.facts{position:absolute;left:14px;top:12px;font-size:12px;color:var(--dim);pointer-events:none}
.facts b{color:var(--ink);font-weight:650}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
      max-height:700px;overflow:auto}
aside h2{margin:0 0 3px;font-size:15px}
aside .canon{color:var(--dim);font-size:12px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sect{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);
      border-top:1px solid var(--line);padding-top:10px;margin:14px 0 8px}
.line{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:3px 0}
.line .g{color:var(--mod);min-width:52px;font-weight:600;font-size:12px}
.line .f{color:var(--ink);word-break:break-all}
.line.gone .f{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:20px;background:#20242e;color:var(--dim)}
.chip.here{background:var(--mod);color:#08111a;font-weight:650}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 22px 18px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hint{color:var(--dim);font-size:12px;padding:0 22px 16px}
.empty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center}
.views{display:flex;gap:6px;padding:0 22px 10px}
.views button{background:transparent;color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.views button.on{background:var(--panel);color:var(--ink);border-color:#39405a}
#matrix,#cmp,#lite{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin:0 22px 22px;padding:4px 0 10px;overflow:auto;max-height:760px}
/* Панель выбора и итогов живёт внутри прокручиваемого блока — липнет к верху,
   иначе при длинной таблице непонятно, что с чем сравнивается. */
.bar{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);
  padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select,.bar button{background:#1b1f28;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.bar button:hover{border-color:#39405a}
.bar .lbl{color:var(--dim);font-size:12px}
.sum{padding:9px 14px;font-size:13px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.sum b{font-variant-numeric:tabular-nums}
.sum .both b{color:var(--mod)} .sum .lo b{color:var(--core)} .sum .ro b{color:var(--data)}
td.nm{color:var(--ink);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:#9fb4d8}
td.dim{color:var(--dim)}
.tag{font-size:11px;padding:1px 7px;border-radius:20px;background:#20242e;color:var(--dim)}
.tag.both{background:#16303c;color:var(--mod)}
.tag.lo{background:#3a1f22;color:var(--core)}
.tag.ro{background:#26330f;color:var(--data)}
.tag.ren{background:#3a3016;color:var(--db)}
.tag.warn{background:#3a1f22;color:var(--core);font-weight:650}
.delta.up{color:var(--data)} .delta.down{color:var(--core)}
.trig{color:var(--dim);font-family:ui-monospace,Consolas,monospace;font-size:11px;
  white-space:normal;max-width:340px}
.srcs{white-space:normal;max-width:320px}
.note{padding:8px 14px;color:var(--dim);font-size:12px}
.note b{color:var(--core)}
h3.grp{margin:16px 0 2px;padding:0 14px;font-size:13px;color:var(--ink);font-weight:650}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 9px;text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:#1b1f28;color:var(--dim);font-weight:600;
  border-bottom:1px solid var(--line);z-index:2}
tbody tr:hover{background:#1c2029}
td.canon{color:var(--ink);font-weight:600;position:sticky;left:0;background:var(--panel)}
tbody tr:hover td.canon{background:#1c2029}
td.miss{color:#3d4354}
td.has{color:#9fb4d8}
td.has b{color:var(--ink);font-weight:600}
.life{color:var(--dim);font-variant-numeric:tabular-nums}
.life.long{color:var(--mod);font-weight:650}
node{}
</style>

<header>
  <h1>P2P — связи файлов <span>по поколениям</span></h1>
  <div class="sub" id="head-sub"></div>
</header>

<div class="views" id="views"><button class="on" data-v="graph">Граф связей</button><button data-v="matrix">Родословная</button><button data-v="cmp">Сравнение</button><button data-v="lite">Чанки Lite</button></div>
<div class="rail" id="rail"></div>
<div class="bodies" id="bodies"></div>

<div class="wrap">
  <div class="stage">
    <svg id="svg"><g id="cam"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div class="facts" id="facts"></div>
  </div>
  <aside id="side"><div class="empty">Кликните узел — покажу его связи и путь через поколения.</div></aside>
</div>

<div id="matrix" hidden></div>
<div id="cmp" hidden></div>
<div id="lite" hidden></div>

<div class="legend">
  <span><i style="background:var(--core)"></i>ядро</span>
  <span><i style="background:var(--db)"></i>база знаний</span>
  <span><i style="background:var(--mod)"></i>модуль</span>
  <span><i style="background:var(--data)"></i>данные вендоров и live</span>
  <span><i style="background:var(--meta)"></i>индекс и сборка</span>
  <span><i style="background:var(--doc)"></i>документация</span>
</div>
<div class="hint">Размер узла — сколько на него ссылаются. Тянуть — мышью по фону, приближать — колесом.</div>

/* ── справочники ────────────────────────────────────────────────────────── */
const gens = DATA.generations;
const bodiesByGen = {};
gens.forEach(g => bodiesByGen[g] = DATA.bodies.filter(b => b.gen === g));

// канон → где встречался: [{gen, label, file, side}]
const home = {};
DATA.bodies.forEach(b => b.nodes.forEach(n => {
  (home[n.canon] = home[n.canon] || []).push(
    {gen: b.gen, label: b.label, file: n.name, side: b.side});
}));

function kind(n){
  const f = n.name.toLowerCase(), c = n.canon;
  if (c === 'core' || f.startsWith('!!core')) return 'core';
  if (c === 'db' || f.startsWith('!!db')) return 'db';
  if (c === 'index' || c === 'master' || c === 'preloader' || c === 'manifest') return 'meta';
  if (/tier|vendor|live|specs|glossary/.test(c)) return 'data';
  if (/guide|readme|changelog|install|faq|mindmap|doc|прочти|что нового|чек/.test(c)) return 'doc';
  return 'mod';
}
const COLOR = {core:'#ff6b6b', db:'#ffd166', mod:'#4cc9f0', data:'#8ac926',
               doc:'#b48ef0', meta:'#f7a072'};

/* ── состояние ──────────────────────────────────────────────────────────── */
let curGen = gens[gens.length - 1];
let curBody = null, sim = null, picked = null;

const rail = document.getElementById('rail');
const bodiesBox = document.getElementById('bodies');

document.getElementById('head-sub').textContent =

function drawRail(){
  [...rail.children].forEach((b,i) => b.classList.toggle('on', gens[i] === curGen));
  bodiesBox.innerHTML = '';

    bodiesBox.appendChild(b);
  });
}

/* ── раскладка: простая силовая симуляция ───────────────────────────────── */
function pickBody(body){
  curBody = body; picked = null; drawRail(); layout(body); paintSide(null);
  const dang = Object.keys(body.dangling || {}).length;
  facts.innerHTML = '<b>' + body.nodes.length + '</b> файлов · <b>' + body.links.length +
    '</b> связей' + (dang ? ' · <b>' + dang + '</b> ссылок в пустоту' : '') +
    '<br>' + body.path;
}

function layout(body){
  const W = svg.clientWidth || 900, H = 700;
  const idx = {}; body.nodes.forEach((n,i) => idx[n.file] = i);
  const N = body.nodes.map((n,i) => ({
    ...n, i,
    x: W/2 + Math.cos(i * 2.399) * (60 + i * 6),
    y: H/2 + Math.sin(i * 2.399) * (60 + i * 6),
    vx: 0, vy: 0, deg: n.in + n.out
  }));
  const L = body.links.map(l => ({s: idx[l.s], t: idx[l.t]}))
                      .filter(l => l.s !== undefined && l.t !== undefined);

  for (let step = 0; step < 520; step++){
    for (let a = 0; a < N.length; a++){
      for (let b = a + 1; b < N.length; b++){
        let dx = N[b].x - N[a].x, dy = N[b].y - N[a].y;
        let d2 = dx*dx + dy*dy || 0.01, d = Math.sqrt(d2);
        const push = 11000 / d2;
        const ux = dx/d*push, uy = dy/d*push;
        N[a].vx -= ux; N[a].vy -= uy; N[b].vx += ux; N[b].vy += uy;
      }
    }
    L.forEach(l => {
      const a = N[l.s], b = N[l.t];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx,dy) || 0.01;
      const pull = (d - 118) * 0.010;
      const ux = dx/d*pull, uy = dy/d*pull;
      a.vx += ux; a.vy += uy; b.vx -= ux; b.vy -= uy;
    });
    N.forEach(n => {
      n.vx += (W/2 - n.x) * 0.0011; n.vy += (H/2 - n.y) * 0.0011;
      n.x += n.vx *= 0.82; n.y += n.vy *= 0.82;
      n.x = Math.max(30, Math.min(W - 30, n.x));
      n.y = Math.max(26, Math.min(H - 26, n.y));
    });
  }

  gEdges.innerHTML = ''; gNodes.innerHTML = '';
  L.forEach(l => {
    const e = document.createElementNS('http://www.w3.org/2000/svg','line');
    e.setAttribute('x1', N[l.s].x); e.setAttribute('y1', N[l.s].y);
    e.setAttribute('x2', N[l.t].x); e.setAttribute('y2', N[l.t].y);
    e.setAttribute('stroke', 'var(--edge)'); e.setAttribute('stroke-width', 1);
    e.dataset.s = l.s; e.dataset.t = l.t;
    gEdges.appendChild(e);
  });
  N.forEach(n => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = 'pointer';
    const r = 4 + Math.min(13, Math.sqrt(n.deg) * 2.4);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', r);
    c.setAttribute('fill', COLOR[kind(n)]); c.setAttribute('fill-opacity', .88);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y + r + 11);
    t.setAttribute('text-anchor','middle'); t.setAttribute('font-size', 10);
    t.setAttribute('fill', n.deg > 3 ? '#c9d0e0' : '#6f778c');
    t.textContent = n.name.replace(/\.(md|txt|html)$/, '');
    g.appendChild(c); g.appendChild(t);
    g.onclick = () => { picked = n.i; highlight(); paintSide(n); };
    gNodes.appendChild(g);
  });
  window._N = N;
  cam.setAttribute('transform','translate(0,0) scale(1)'); view = {x:0,y:0,k:1};
  highlight();
}

function highlight(){
  [...gEdges.children].forEach(e => {
    const on = picked !== null && (+e.dataset.s === picked || +e.dataset.t === picked);
    e.setAttribute('stroke', on ? '#5f7cff' : 'var(--edge)');
    e.setAttribute('stroke-width', on ? 2 : 1);
    e.setAttribute('stroke-opacity', picked === null ? .55 : (on ? .95 : .18));
  });
  [...gNodes.children].forEach((g,i) => {
    g.style.opacity = picked === null ? 1 : (i === picked ? 1 : .35);
  });
}

/* ── панель: связи узла и его путь через поколения ──────────────────────── */
function paintSide(n){
  if (!n){ side.innerHTML = '<div class="empty">Кликните узел — покажу его связи и путь через поколения.</div>'; return; }
  const outs = curBody.links.filter(l => l.s === n.file).map(l => l.t);
  const ins  = curBody.links.filter(l => l.t === n.file).map(l => l.s);
  const short = p => p.split('/').pop();

  let h = '<h2>' + n.name + '</h2><div class="canon">канон: ' + n.canon + '</div>';
  h += '<dl class="kv">' +
       '<dt>строк</dt><dd>' + n.lines.toLocaleString('ru') + '</dd>' +
       '<dt>байт</dt><dd>' + n.bytes.toLocaleString('ru') + '</dd>' +
       '<dt>ссылается на</dt><dd>' + n.out + '</dd>' +
       '<dt>ссылаются на него</dt><dd>' + n.in + '</dd>' +
       (n.anchors ? '<dt>якорей #DB_*</dt><dd>' + n.anchors + '</dd>' : '') +
       '</dl>';

  const path = home[n.canon] || [];
  h += '<div class="sect">путь через поколения</div><div class="chips">';
  gens.forEach(g => {
    const here = path.some(p => p.gen === g);
    h += '<span class="chip' + (here ? ' here' : '') + '">' + g + '</span>';
  });
  h += '</div>';
  const seen = new Set();
  path.forEach(p => {
    const key = p.gen + p.file; if (seen.has(key)) return; seen.add(key);
    h += '<div class="line' + (p.gen === curGen ? '' : ' gone') + '">' +
         '<span class="g">' + p.gen + '</span><span class="f">' + p.file +
         (p.side ? ' <span class="chip">' + p.label + '</span>' : '') + '</span></div>';
  });

  if (ins.length){
    h += '<div class="sect">на него ссылаются (' + ins.length + ')</div>';
    ins.forEach(f => h += '<div class="line"><span class="f">' + short(f) + '</span></div>');
  }
  if (outs.length){
    h += '<div class="sect">он ссылается на (' + outs.length + ')</div>';
    outs.forEach(f => h += '<div class="line"><span class="f">' + short(f) + '</span></div>');
  }
  if (!ins.length && !outs.length)
    h += '<div class="sect">связей нет</div><div class="line"><span class="f">файл ни на кого не ссылается и на него не ссылаются</span></div>';
  side.innerHTML = h;
}

/* ── камера ─────────────────────────────────────────────────────────────── */
let view = {x:0, y:0, k:1}, drag = null;
svg.addEventListener('mousedown', e => { drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; });
addEventListener('mouseup', () => drag = null);
addEventListener('mousemove', e => {
  if (!drag) return;
  view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y);
  cam.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
});
svg.addEventListener('wheel', e => {
  e.preventDefault();
  view.k = Math.max(.35, Math.min(3, view.k * (e.deltaY < 0 ? 1.12 : .89)));
  cam.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
}, {passive:false});

/* ── вид «родословная»: канон × поколение ───────────────────────────────── */
function buildMatrix(){
  const box = document.getElementById('matrix');
  const rows = DATA.lineage.filter(l => l.canon && l.canon !== '');
  let h = '<table><thead><tr><th>модуль</th><th class="life">поколений</th>';
  gens.forEach(g => h += '<th>' + g + '</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(l => {
    h += '<tr><td class="canon">' + l.canon + '</td>' +
         '<td class="life' + (l.gens.length >= 4 ? ' long' : '') + '">' + l.gens.length + '</td>';
    gens.forEach(g => {
      const hits = (home[l.canon] || []).filter(p => p.gen === g);
      if (!hits.length){ h += '<td class="miss">·</td>'; return; }
      const main = hits.find(p => !p.side) || hits[0];
      const extra = hits.filter(p => p.file !== main.file).length;
      h += '<td class="has"><b>' + main.file.replace(/\.(md|txt|html)$/, '') + '</b>' +
           (extra ? ' <span class="chip">+' + extra + '</span>' : '') + '</td>';
    });
    h += '</tr>';
  });
  box.innerHTML = h + '</tbody></table>';
}

/* ── вид «сравнение»: два тела поставки бок о бок ────────────────────────── */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const num = n => (n || 0).toLocaleString('ru');
const bodyName = b => b.gen + ' · ' + b.label;

// канон → узлы тела. Один канон может собрать несколько файлов (ядро + база
// в одном каталоге), поэтому список, а не одна запись.
function byCanon(body){
  const m = new Map();
  body.nodes.forEach(n => {
    if (!m.has(n.canon)) m.set(n.canon, []);
    m.get(n.canon).push(n);
  });
  return m;
}

let cmpL = 0, cmpR = 0, cmpSort = 'state';
(function pickDefaults(){
  // По умолчанию — та самая пара, ради которой вид и делался: H против Lite.
  const h = DATA.bodies.findIndex(b => /-H\/files$/.test(b.path));
  const l = DATA.bodies.findIndex(b => /-L\/boot$/.test(b.path));
  cmpL = h >= 0 ? h : Math.max(0, DATA.bodies.length - 2);
  cmpR = l >= 0 ? l : DATA.bodies.length - 1;
})();

function buildCmp(){
  const box = document.getElementById('cmp');
  const A = DATA.bodies[cmpL], B = DATA.bodies[cmpR];
  const ma = byCanon(A), mb = byCanon(B);
  const keys = [...new Set([...ma.keys(), ...mb.keys()])];

  const rows = keys.map(c => {
    const a = ma.get(c) || null, b = mb.get(c) || null;
    const A1 = a ? a[0] : null, B1 = b ? b[0] : null;
    return {
      canon: c || '—',
      state: a && b ? 'both' : (a ? 'lo' : 'ro'),
      a: A1, b: B1, aExtra: a ? a.length - 1 : 0, bExtra: b ? b.length - 1 : 0,
      renamed: !!(A1 && B1 && A1.name !== B1.name),
      delta: (A1 && B1) ? B1.lines - A1.lines : 0,
      size: Math.max(A1 ? A1.lines : 0, B1 ? B1.lines : 0)
    };
  });
  const ORDER = {both:0, lo:1, ro:2};
  const by = {
    state: (x,y) => ORDER[x.state] - ORDER[y.state] || x.canon.localeCompare(y.canon),
    canon: (x,y) => x.canon.localeCompare(y.canon),
    delta: (x,y) => Math.abs(y.delta) - Math.abs(x.delta) || x.canon.localeCompare(y.canon),
    lines: (x,y) => y.size - x.size || x.canon.localeCompare(y.canon)
  };
  rows.sort(by[cmpSort] || by.state);

  const nBoth = rows.filter(r => r.state === 'both').length;
  const nLo = rows.filter(r => r.state === 'lo').length;
  const nRo = rows.filter(r => r.state === 'ro').length;
  const nRen = rows.filter(r => r.renamed).length;

  const opts = i => DATA.bodies.map((b, j) =>
    '<option value="' + j + '"' + (j === i ? ' selected' : '') + '>' +
    esc(bodyName(b)) + ' (' + b.nodes.length + ')</option>').join('');

  let h = '<div class="bar">' +
    '<span class="lbl">слева</span><select id="cmp-l">' + opts(cmpL) + '</select>' +
    '<button id="cmp-swap" title="поменять местами">⇄</button>' +
    '<span class="lbl">справа</span><select id="cmp-r">' + opts(cmpR) + '</select>' +
    '<span class="lbl">сортировка</span><select id="cmp-sort">' +
      ['state:по состоянию','canon:по имени модуля','delta:по разнице строк','lines:по объёму']
        .map(o => { const [v,t] = o.split(':');
          return '<option value="' + v + '"' + (v === cmpSort ? ' selected' : '') + '>' + t + '</option>'; })
        .join('') +
    '</select></div>';

  h += '<div class="sum">' +
    '<span class="both">общих <b>' + nBoth + '</b></span>' +
    '<span class="lo">только слева <b>' + nLo + '</b></span>' +
    '<span class="ro">только справа <b>' + nRo + '</b></span>' +
    '<span>переименовано <b>' + nRen + '</b></span>' +
    '<span>' + esc(A.path) + ' → ' + esc(B.path) + '</span></div>';

  h += '<table><thead><tr><th></th><th>модуль</th>' +
       '<th>' + esc(bodyName(A)) + '</th><th class="num">строк</th><th class="num">байт</th><th class="num">вх/исх</th>' +
       '<th>' + esc(bodyName(B)) + '</th><th class="num">строк</th><th class="num">байт</th><th class="num">вх/исх</th>' +
       '<th class="num">Δ строк</th></tr></thead><tbody>';
  const cell = (n, extra) => n
    ? '<td>' + esc(n.name) + (extra ? ' <span class="tag">+' + extra + '</span>' : '') + '</td>' +
      '<td class="num">' + num(n.lines) + '</td><td class="num">' + num(n.bytes) + '</td>' +
      '<td class="num">' + n.in + '/' + n.out + '</td>'
    : '<td class="miss">·</td><td class="miss">·</td><td class="miss">·</td><td class="miss">·</td>';
  const TAG = {both:'общий', lo:'слева', ro:'справа'};
  rows.forEach(r => {
    h += '<tr><td><span class="tag ' + r.state + '">' + TAG[r.state] + '</span>' +
         (r.renamed ? ' <span class="tag ren">переименован</span>' : '') + '</td>' +
         '<td class="nm">' + esc(r.canon) + '</td>' +
         cell(r.a, r.aExtra) + cell(r.b, r.bExtra) +
         '<td class="num">' + (r.state === 'both'
            ? (r.delta ? '<span class="delta ' + (r.delta > 0 ? 'up">+' : 'down">') + num(r.delta) + '</span>' : '0')
            : '<span class="miss">·</span>') + '</td></tr>';
  });
  box.innerHTML = h + '</tbody></table>';

  document.getElementById('cmp-l').onchange = e => { cmpL = +e.target.value; buildCmp(); };
  document.getElementById('cmp-r').onchange = e => { cmpR = +e.target.value; buildCmp(); };
  document.getElementById('cmp-sort').onchange = e => { cmpSort = e.target.value; buildCmp(); };
  document.getElementById('cmp-swap').onclick = () => { const t = cmpL; cmpL = cmpR; cmpR = t; buildCmp(); };
}

/* ── вид «чанки Lite»: рецепт, пересборка и то, что лежит в гисте ────────── */
function buildLite(){
  const box = document.getElementById('lite');
  const L = DATA.lite;
  if (!L){ box.innerHTML = '<div class="empty">данных о чанках нет — страница собрана старой версией graph.py</div>'; return; }

  const S = L.sources;
  const miss = Object.keys(S).filter(k => !S[k].found);
  const NAME = {recipe:'рецепт', manifest:'манифест пересборки', index:'индекс Lite', h:'файлы редакции H'};
  let h = '<div class="bar"><span class="lbl">редакция</span><b>' + esc(L.edition || '—') + '</b>' +
    Object.keys(S).map(k => '<span class="lbl">' + NAME[k] + ': ' +
      (S[k].found ? esc(S[k].path) : '<span class="tag warn">не найден</span>') + '</span>').join('') +
    '</div>';
  if (miss.length)
    h += '<div class="note"><b>нет источника:</b> ' +
         miss.map(k => NAME[k]).join(', ') + ' — таблицы ниже неполны</div>';
  if (!L.chunks.length){
    box.innerHTML = h + '<div class="empty">рецепт не найден — состав чанков показать не из чего</div>';
    return;
  }

  const lb = DATA.bodies.find(b => /-L\/boot$/.test(b.path));
  h += '<div class="sum"><span>чанков <b>' + L.chunks.length + '</b></span>' +
       '<span>файлов H <b>' + L.files.length + '</b></span>' +
       '<span class="lo">не попало ни в один чанк <b>' + L.orphans.length + '</b></span>' +
       (lb ? '<span>своих файлов у Lite <b>' + lb.nodes.length + '</b>: ' +
             lb.nodes.map(n => esc(n.name)).join(', ') + '</span>' : '') + '</div>';

  h += '<h3 class="grp">чанк → что в него входит</h3>';
  h += '<table><thead><tr><th>чанк</th><th>файлы редакции H</th>' +
       '<th class="num">KB пересборки</th><th class="num">KB в гисте</th>' +
       '<th>состояние</th><th>триггер загрузки</th></tr></thead><tbody>';
  L.chunks.forEach(c => {
    const st = !c.in_gist ? '<span class="tag warn">нет в гисте</span>'
             : !c.in_manifest ? '<span class="tag">не пересобирался</span>'
             : c.stale ? '<span class="tag ren">в гисте старое</span>'
             : '<span class="tag both">совпадает</span>';
    const srcs = c.sources.length
      ? c.sources.map(s => esc(s.file) + (s.missing ? ' <span class="tag warn">нет файла</span>' : '')).join('<br>')
      : '<span class="miss">не собирается из файлов H' + (c.load ? ' · ' + esc(c.load) : '') + '</span>';
    h += '<tr><td class="nm">' + esc(c.name) + '</td>' +
         '<td class="srcs">' + srcs + '</td>' +
         '<td class="num">' + (c.kb_new == null ? '<span class="miss">·</span>' : c.kb_new) + '</td>' +
         '<td class="num">' + (c.kb_gist == null ? '<span class="miss">·</span>' : c.kb_gist) + '</td>' +
         '<td>' + st + '</td><td class="trig">' + esc(c.trigger || '—') + '</td></tr>';
  });
  h += '</tbody></table>';

  h += '<h3 class="grp">файл редакции H → в какие чанки попал</h3>' +
       '<div class="note">файл, не попавший ни в один чанк, пользователю Lite недоступен — ' +
       'если только у Lite нет своего такого файла</div>';
  h += '<table><thead><tr><th>файл</th><th class="num">строк</th><th class="num">байт</th>' +
       '<th>чанки</th></tr></thead><tbody>';
  // Сироты вверх: ради них таблица и нужна.
  const files = L.files.slice().sort((x, y) =>
    (x.chunks.length ? 1 : 0) - (y.chunks.length ? 1 : 0) || x.file.localeCompare(y.file));
  files.forEach(f => {
    h += '<tr><td class="nm">' + esc(f.file) + '</td>' +
         '<td class="num">' + num(f.lines) + '</td><td class="num">' + num(f.bytes) + '</td>' +
         '<td>' + (f.chunks.length
            ? f.chunks.map(c => '<span class="tag both">' + esc(c) + '</span>').join(' ')
            : '<span class="tag warn">ни в одном</span>') + '</td></tr>';
  });
  box.innerHTML = h + '</tbody></table>';
}

/* ── переключатель видов ────────────────────────────────────────────────── */
// Части страницы, видимые в каждом виде. Прятать — только через hidden:
// у .wrap стоит display:grid и без !important атрибут им перебивается.
const VIEW_PARTS = {
  graph:  ['.wrap', '#rail', '#bodies', '.legend', '.hint'],
  matrix: ['#matrix'],
  cmp:    ['#cmp'],
  lite:   ['#lite']
};
const BUILD = {matrix: buildMatrix, cmp: buildCmp, lite: buildLite};

function showView(v){
  Object.keys(VIEW_PARTS).forEach(k => VIEW_PARTS[k].forEach(sel => {
    const el = document.querySelector(sel); if (el) el.hidden = k !== v;
  }));
  if (BUILD[v] && !document.querySelector(VIEW_PARTS[v][0]).innerHTML) BUILD[v]();
}

document.getElementById('views').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...document.getElementById('views').children].forEach(x => x.classList.toggle('on', x === b));
  showView(b.dataset.v);
});

pickBody(bodiesByGen[curGen][0]);
